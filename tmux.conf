set -g mouse on
set -g mode-keys vi

# Desktop notification (via terminal-notifier) whenever any window rings
# the terminal bell -- e.g. Claude Code's preferredNotifChannel=terminal_bell.
set-hook -g alert-bell 'run-shell "terminal-notifier -title tmux -subtitle \"#{session_name}: #{window_name}\" -message Bell -sound default"'
set -g status-position top
set -g allow-passthrough on
set -g allow-rename off
# automatic-rename is unrelated to allow-rename above: it's tmux's own
# pty-level tracking of the pane's foreground process (e.g. "claude" while
# Claude Code runs, "zsh" back at the prompt), not an escape-sequence path.
# A manual rename-window still disables it for that one window, so it
# doesn't reintroduce the earlier problem of renames getting clobbered.
set -g automatic-rename on
# Claude Code overwrites its own process's short kernel name (what
# pane_current_command reads) to its bare version string (e.g. "2.1.266"),
# not "claude" -- relabel anything matching that shape. Prefer pane_title
# (Claude Code sets it via allow-set-title to the session name, e.g. after
# /rename) when set, else fall back to "claude". For nvim, show the
# project dir basename (same #{b:pane_current_path} idiom pane-border-format
# below already uses) instead of the generic "nvim" -- pane_title for nvim
# is the full titlestring ("nvim - <dir> · <file>"), no clean way to pull
# just the dir out of that via format expressions. Same for a bare idle
# shell (zsh) -- more useful than just "zsh" everywhere.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{?#{==:#{pane_title},},claude,#{pane_title}},#{?#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},zsh}},#{b:pane_current_path},#{pane_current_command}}}}#{?pane_dead,[dead],}'
set -g set-titles on
set -g history-limit 2147483647
set -g extended-keys on
set -g extended-keys-format csi-u
set -g set-titles-string '#{?#{==:#{pane_title},},#S · #W,#T}#{?session_alerts, [#{session_alerts}],}'

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set-option -sg escape-time 10
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ',xterm-kitty:cnorm=\E[?12h\E[?25h'
# tmux's built-in xterm* feature detection doesn't include hyperlinks, so
# OSC 8 links (Cmd-click in Ghostty) get eaten instead of passed through.
set-option -ag terminal-features ',xterm-ghostty:hyperlinks'

# Vi copy mode bindings
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'V' send-keys -X select-line
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# For macOS clipboard integration
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window

# Ctrl+Option+Shift+arrow to move between panes.
bind-key -n C-M-S-Left select-pane -L
bind-key -n C-M-S-Right select-pane -R
bind-key -n C-M-S-Up select-pane -U
bind-key -n C-M-S-Down select-pane -D

# n/p freed up from window-navigation duty (now on Ctrl+Shift+Left/Right
# above) -- repurpose for rearranging instead. swap-window alone leaves
# the active window at the old index (now occupied by whatever it swapped
# with), not following the moved one -- chain a select-window on the same
# relative target to follow it.
bind-key p swap-window -t -1 \; select-window -t -1
bind-key n swap-window -t +1 \; select-window -t +1

# New window with current path, appended after the last window instead of
# filling the lowest available index (which can land next to the current
# window if an earlier one left a gap; renumber-windows is off).
bind c new-window -c "#{pane_current_path}" -a -t ':$'

unbind '"'
unbind %

# Pane visibility: heavy borders + per-pane title (border COLOR set by tmux2k below)
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format ' #P #{pane_current_command} #{?#{==:#{pane_current_command},ssh},#{pane_title},#{b:pane_current_path}} '

# Dim inactive pane text only; bg=default preserves terminal transparency
set -g window-style        'fg=colour239,bg=default'
set -g window-active-style 'fg=colour255,bg=default'

set -g @tmux2k-theme 'onedark'
# TokyoNight palette to match Ghostty + nvim; also drives pane border colors
set -g @tmux2k-black '#1a1b26'
# TokyoNight's own bg_highlight for this exact bg -- lifts the status bar
# (and inactive window-list entries) a step lighter than the plain background.
set -g @tmux2k-bg-main '#292e42'
set -g @tmux2k-white '#c0caf5'
set -g @tmux2k-blue  '#7aa2f7'
set -g @tmux2k-pane-active-border '#7aa2f7'
set -g @tmux2k-pane-border        '#565f89'
set -g @tmux2k-session-icon " #W"
set -g @tmux2k-icons-only true
set -g @tmux2k-right-plugins "group1 custom time"
set -g @tmux2k-custom-icon ''
set -g @tmux2k-group1-plugins "cpu ram cpu-temp updates"
# tmux2k has no built-in color entry for "group"/"group1" (it's a plain
# container, not a themed plugin), so it falls back to an empty fg/bg pair --
# which produces an invalid `#[fg=,bg=]` style tag that silently drops
# everything after it up to the next valid style. Set one explicitly.
# Built-in plugin colors get auto fg/bg-reversed under @tmux2k-icons-only
# (dark bg + colored text, matching e.g. the clock); a raw @tmux2k-*-colors
# option bypasses that reversal, so pre-reverse it here to match.
set -g @tmux2k-group1-colors "text light_green"
set -g @tmux2k-window-list-format "#I:#W [#{?window_zoomed_flag,+,#{window_panes}}]"
set -g @tmux2k-time-format "%H:%M:%S"
set -g @tmux2k-left-plugins "cwd git"

# ssh split
set-option -g @ssh-split-keep-cwd "true"
set-option -g @ssh-split-keep-remote-cwd "true"
set-option -g @ssh-split-fail "false"
set-option -g @ssh-split-no-env "false"
set-option -g @ssh-split-no-shell "false"
set-option -g @ssh-split-strip-cmd "true"
set-option -g @ssh-split-verbose "true"
set-option -g @ssh-split-debug "true"
set-option -g @ssh-split-h-key "|"
set-option -g @ssh-split-v-key "_"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

# tmux2k always appends window_flags (the "*" current-window marker, among
# others) to window-status-current-format too, which is redundant there --
# the current window is already visually distinct via its highlight color.
# Override after tmux2k builds it (same colors, just the flags dropped);
# window-status-format (other windows) keeps its flags untouched.
set -g window-status-current-format '#[fg=#1a1b26,bg=#e06c75] #I:#W [#{?window_zoomed_flag,+,#{window_panes}}] '
