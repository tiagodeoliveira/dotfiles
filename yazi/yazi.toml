[mgr]
ratio = [1, 2, 5]

# yazi's own default caps preview renders at 600x900px, well below what a
# normal terminal pane actually has room for -- raise it so images fill
# the available preview area instead of leaving it partly blank.
[preview]
max_width = 2000
max_height = 2000

# zoom.yazi: owns image previewing so zoom/pan state survives redraws --
# without this, whatever else previews images would overwrite the zoomed
# view on the next redraw (center-media narrowed to video/* below, so it
# no longer competes for image/*).
[[plugin.prepend_previewers]]
mime = "image/*"
run = "zoom"

# git.yazi: per-file git status indicators in the file list
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

# duckdb.yazi: tabular data preview (csv/tsv/json/parquet/txt/xlsx/duckdb)
[[plugin.prepend_previewers]]
url = "*.{csv,tsv,json,parquet,txt,xlsx,db,duckdb}"
run = "duckdb"

[[plugin.prepend_preloaders]]
url = "*.{csv,tsv,json,parquet,txt,xlsx}"
run = "duckdb"
multi = false

# rich-preview.yazi: markdown/rst/notebooks (csv/json owned by duckdb above)
[[plugin.prepend_previewers]]
url = "*.md"
run = "rich-preview"

[[plugin.prepend_previewers]]
url = "*.rst"
run = "rich-preview"

[[plugin.prepend_previewers]]
url = "*.ipynb"
run = "rich-preview"

# center-media.yazi: video centering + metadata (images owned by zoom.yazi above, audio owned by exifaudio below)
[[plugin.prepend_previewers]]
mime = "video/*"
run = "center-media"

[[plugin.prepend_preloaders]]
mime = "video/*"
run = "center-media"

[[plugin.prepend_previewers]]
mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}"
run = "center-media"

[[plugin.prepend_previewers]]
url = "*.{ai,eps,ait}"
run = "center-media"

[[plugin.prepend_preloaders]]
mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}"
run = "center-media"

[[plugin.prepend_preloaders]]
url = "*.{ai,eps,ait}"
run = "center-media"

# exifaudio.yazi: audio cover art + metadata
[[plugin.prepend_previewers]]
mime = "audio/*"
run = "exifaudio"

# exiftool.yazi: executable metadata
[[plugin.prepend_previewers]]
mime = "*executable*"
run = "exiftool"

# ouch.yazi: archive contents preview
[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run = "ouch"
