# chmod.yazi
[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

# diff.yazi
[[mgr.prepend_keymap]]
on = "<C-d>"
run = "plugin diff"
desc = "Diff the selected with the hovered file"

# what-size.yazi
[[mgr.prepend_keymap]]
on = [".", "s"]
run = "plugin what-size"
desc = "Calc size of selection or cwd"

# zoom.yazi
[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out hovered file"

# center-media.yazi
[[mgr.prepend_keymap]]
on = "<F3>"
run = "plugin center-media -- toggle-metadata"
desc = "Toggle media metadata"

[[mgr.prepend_keymap]]
on = "<F4>"
run = "plugin center-media -- toggle-preview"
desc = "Toggle media image"

[[mgr.prepend_keymap]]
on = "<F5>"
run = "plugin center-media -- reset"
desc = "Reset media preview"

# ouch.yazi
[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

# duckdb.yazi -- H/L override yazi's default back/forward history navigation.
# yazi 26.x needs "--" before the arg, or it's parsed as a flag to `plugin`.
[[mgr.prepend_keymap]]
on = "H"
run = "plugin duckdb -- -1"
desc = "Scroll one column to the left"

[[mgr.prepend_keymap]]
on = "L"
run = "plugin duckdb -- +1"
desc = "Scroll one column to the right"

[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "plugin duckdb -- -open"
desc = "Open with duckdb"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "plugin duckdb -- -ui"
desc = "Open with duckdb ui"

# autosession.yazi -- repurposes plain quit into save-and-quit
[[mgr.prepend_keymap]]
on = ["q"]
run = "plugin autosession -- save-and-quit"
desc = "Save session and quit"

# compress.yazi
[[mgr.prepend_keymap]]
on = ["c", "a", "a"]
run = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on = ["c", "a", "p"]
run = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on = ["c", "a", "h"]
run = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on = ["c", "a", "l"]
run = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on = ["c", "a", "u"]
run = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"

# rsync.yazi
[[mgr.prepend_keymap]]
on = ["R"]
run = "plugin rsync"
desc = "Copy files using rsync"

# sshfs.yazi -- single menu entry point, per upstream's recommended preset
[[mgr.prepend_keymap]]
on = ["M", "s"]
run = "plugin sshfs -- menu"
desc = "Open SSHFS options"
